<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proyectos ET 35</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>PROYECTOS TECNICA 35</h1>
    </header>

    <main id="inicio">

        <div class="proyectos">

            <div class="proyecto" onclick="abrirProyecto('COL-FI')">
                <h2>COL-FI</h2>
                <p>descripcion</p>
            </div>

            <div class="proyecto" onclick="abrirProyecto('EL ARCHIPIÉLAGO')">
                <h2>EL ARCHIPIÉLAGO</h2>
                <p>descripcion</p>
            </div>

            <div class="proyecto" onclick="abrirProyecto('ESTILIZA TU VIDA')">
                <h2>ESTILIZA TU VIDA</h2>
                <p>descripcion</p>
            </div>

            <div class="proyecto" onclick="abrirProyecto('LIBRITOS')">
                <h2>LIBRITOS</h2>
                <p>descripcion</p>
            </div>

            <div class="proyecto" onclick="abrirProyecto('NUESTRA CANTINA')">
                <h2>NUESTRA CANTINA</h2>
                <p>descripcion</p>
            </div>

            <div class="proyecto" onclick="abrirProyecto('OSO POLAR')">
                <h2>OSO POLAR</h2>
                <p>descripcion</p>
            </div>

            <div class="proyecto" onclick="abrirProyecto('PROYECTOS EN C')">
                <h2>PROYECTOS EN C</h2>
                <p>descripcion</p>
            </div>
            <div class="proyecto" onclick="abrirProyecto('SAN TELMO VERDE')">
                <h2>SAN TELMO VERDE</h2>
                <p>descripcion</p>
            </div>
        </div>
    </main>
    <!-- PÁGINA DEL PROYECTO -->
    <section id="detalle" class="oculto">
        <button onclick="volver()">← VOLVER</button>
        <h1 id="tituloProyecto"></h1>
        <!-- DESCRIPCIÓN (IMPORTANTE PARA JS) -->
        <p id="descripcionProyecto"></p>
        <!-- BOTONES DINÁMICOS -->
        <div class="recursos">
            <div class="recurso">
                <div class="botones" id="botones-proyecto">
                    <!-- JS los carga acá -->
                </div>
            </div>
        </div>

    </section>
    <script src="script.js"></script>
</body>
</html>
